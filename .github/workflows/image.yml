name: Table image

# The table's image (ADR 0080): built from the commit, tried the way the container app runs it, and the
# infrastructure template compiled and linted beside it, so a change that breaks only the container or the
# template is caught before it merges. CI calls it when the diff touches what the image carries (ADR 0182,
# studio/browser/plan.js), and asks for the push on main; deploy.yml calls it for a deployment asked by hand.
# Nothing here holds a secret: the registry is reached with the run's own token.

on:
  workflow_call:
    inputs:
      push:
        description: Whether to push the image to GitHub's container registry once it has been tried.
        type: boolean
        default: false
    outputs:
      image:
        description: The image's full name, tagged with its commit.
        value: ${{ jobs.image.outputs.image }}

permissions:
  contents: read

jobs:
  image:
    name: Build and try the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tagged with the commit, never `latest`: the container app then names exactly what it runs, and the
      # engine version stamped on every recording is the same twelve characters.
      - name: Name the image
        id: name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "image=ghcr.io/${OWNER,,}/downfall-table:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: docker build --build-arg ENGINE_COMMIT="${GITHUB_SHA::12}" --tag "$IMAGE" .

      - name: Try it the way the container app runs it
        env:
          IMAGE: ${{ steps.name.outputs.image }}
        run: .github/scripts/try-table-image.sh "$IMAGE"

      # The template is compiled and linted on every run, a warning included: a deployment is the wrong
      # place to learn that a property name is misspelled.
      - name: Check the infrastructure template
        run: |
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep 2>&1 | tee "$RUNNER_TEMP/bicep-lint.txt"
          if grep -Eq '(Warning|Error) ' "$RUNNER_TEMP/bicep-lint.txt"; then
            echo "::error::The Bicep linter has something to say about infra/main.bicep."
            exit 1
          fi

      - name: Push
        if: inputs.push
        env:
          IMAGE: ${{ steps.name.outputs.image }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker push "$IMAGE"
