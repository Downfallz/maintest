name: Search the agent weights

# One cross-entropy search of the heuristic agent's eight scoring weights on the CI runners
# (docs/learning/training.md). Ask for a run from a phone; read the table in the run summary.
#
# What `apply` does, and what it deliberately does not do. The weights of `Greedy` are the benchmark baseline
# every learned agent is measured against, so moving them invalidates every comparison in the journal; that is
# a decision to take deliberately, not a file a workflow rewrites. So `apply` never touches
# `ScoringWeights.Default` or `learning/weights/greedy.json`: it commits what the search found under its own
# name next to them, which is what docs/learning/agents.md says to do with a searched set. Adopting it as the
# baseline stays a separate, human change.
#
# The journal entry of 2026-09-10 is the worked example of why that line is where it is: the search found a
# better agent and the entry decided against making it the baseline.
on:
  workflow_dispatch:
    inputs:
      opponent:
        description: "Agent B of every evaluation, or several separated by commas, e.g. greedy,heuristic:learning/weights/search-4.json,random: a candidate then scores the mean over them, and one that falls below the start against any of them ranks below every one that did not, so it cannot win by learning one of them (journal, 2026-09-16)"
        default: greedy
      check_opponent:
        description: "A second opponent the hold-out also replays both agents against, or empty for none. A set that beats the opponent it was searched against and falls against this one learned that opponent, not the game (journal, 2026-09-16)"
        default: random
      kind:
        description: "The agent kind that plays each candidate: heuristic reads the weights one step, lookahead and minimax play the round out (docs/learning/agents.md)"
        type: choice
        options: [heuristic, lookahead, minimax]
        default: heuristic
      initial:
        description: "Weights the search starts from (empty: the built-in ones, which greedy plays)"
        default: ""
      seeds:
        description: "Seed file of every evaluation"
        default: benchmarks/benchmark-seeds.json
      iterations:
        description: "Rounds of the search"
        default: "10"
      population:
        description: "Candidates played per round"
        default: "16"
      seed:
        description: "Search seed"
        default: "0"
      apply:
        description: "Commit the weights it found as their own file on a branch, or only report them"
        type: boolean
        default: false

# Pushing the proposal branch, and nothing else. GitHub Actions permissions cannot be conditional, so this is
# `write` even on a report-only run; the checkout below is what actually decides whether a credential is on
# disk, and it only keeps one when `apply` is set.
permissions:
  contents: write

concurrency:
  group: search-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  BRANCH: search/${{ github.run_number }}
  # The searched set, under its own name next to greedy.json (docs/learning/agents.md). Weights searched for
  # a reading other than the one-step one carry that reading's name, because they are only meaningful played
  # by it: `lookahead-12.json` is for `lookahead:`, not for `heuristic:`.
  FOUND: learning/weights/${{ inputs.kind == 'heuristic' && 'search' || inputs.kind }}-${{ github.run_number }}.json
  # Under runs/, which .gitignore covers: inside the workspace for the artifact, invisible to git.
  OUT: runs/search-${{ github.run_number }}

jobs:
  search:
    name: Search the scoring weights
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # A report-only run keeps no credential on disk, the way this workflow always did. An applying run keeps
      # the one the checkout sets up and lets git use it, because the alternative is a token inside a remote
      # URL, which puts it in the process list and in every error message git prints.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: ${{ inputs.apply }}

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install uv and the dependencies of the learning project
        run: |
          pipx install uv==0.8.17
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/learning-venv" >> "$GITHUB_ENV"
          echo "UV_NO_SYNC=1" >> "$GITHUB_ENV"
          echo "PYTHONPATH=$GITHUB_WORKSPACE/learning/src" >> "$GITHUB_ENV"
          export UV_PROJECT_ENVIRONMENT="$RUNNER_TEMP/learning-venv"
          uv sync --project learning --locked --no-build --no-install-project

      - name: Build
        run: |
          dotnet restore
          dotnet build --no-restore --configuration Release

      - name: Build game content
        run: dotnet run --project tools/DownfallArena.DataBuilder --no-build --configuration Release -- data data/dst

      # Inputs reach the shell through the environment, never through the script text.
      # `initial` is what lets the ladder climb. Without it every run restarts from the built-in weights, so a
      # search against a set stronger than Greedy begins the climb from behind whatever it is trying to beat,
      # and run 5 cannot build on run 4. The CLI has always taken `--initial`; only this form did not pass it.
      - name: Search
        env:
          OPPONENT: ${{ inputs.opponent }}
          KIND: ${{ inputs.kind }}
          INITIAL: ${{ inputs.initial }}
          SEEDS: ${{ inputs.seeds }}
          ITERATIONS: ${{ inputs.iterations }}
          POPULATION: ${{ inputs.population }}
          SEED: ${{ inputs.seed }}
        run: |
          mkdir -p "$OUT"
          start=()
          if [[ -n "$INITIAL" ]]; then
            start=(--initial "$INITIAL")
          fi
          uv run --project learning --locked --no-sync --no-build \
            python -m downfall_learning.cli search-weights -o "$OUT" \
            --opponent "$OPPONENT" --kind "$KIND" "${start[@]}" --seeds "$SEEDS" \
            --iterations "$ITERATIONS" --population "$POPULATION" --seed "$SEED" \
            2>&1 | tee "$OUT/search.log"

      # Only ratios matter -- scaling every weight scales every score -- so the table reads each weight against
      # damage. A weight whose ratio did not move is one the search had no use for.
      - name: Put the weights in the run summary
        if: always()
        env:
          OPPONENT: ${{ inputs.opponent }}
          INITIAL: ${{ inputs.initial }}
          SEEDS: ${{ inputs.seeds }}
          ITERATIONS: ${{ inputs.iterations }}
          POPULATION: ${{ inputs.population }}
          SEED: ${{ inputs.seed }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          {
            echo "## Weight search \`$RUN_NUMBER\`"
            echo
            echo "Against \`$OPPONENT\` on \`$SEEDS\`, $ITERATIONS rounds of $POPULATION, seed \`$SEED\`,"
            echo "starting from \`${INITIAL:-the built-in weights}\`."
            echo
            echo '```'
            cat "$OUT/search.log" 2>/dev/null || echo 'The search wrote nothing.'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          found="$OUT/weights.json"
          started_from="${INITIAL:-learning/weights/greedy.json}"
          if [[ -f "$found" ]]; then
            {
              echo
              echo "### The weights it found, as ratios to \`damage\`, against the ones it started from"
              echo
              echo "| Weight | \`$started_from\` | Found | Change |"
              echo "| --- | --- | --- | --- |"
              jq -rs '
                (.[0]) as $new | (.[1]) as $old
                | ($new.damage) as $dn | ($old.damage) as $do
                | ($old | keys_unsorted[]) as $key
                | [$key, ($old[$key] / $do), ($new[$key] / $dn)]
                | "| `\(.[0])` | \(.[1] * 1000 | round / 1000) | \(.[2] * 1000 | round / 1000) | \(((.[2] / (if .[1] == 0 then 1 else .[1] end) - 1) * 1000 | round / 10))% |"
              ' "$found" "$started_from"
              echo
              echo "\`learning/weights/greedy.json\` is not touched either way: it is the benchmark baseline, and"
              echo "moving it makes every comparison in \`docs/learning/journal.md\` incomparable. Adopting these"
              echo "as the baseline is a commit with a journal entry that says why, not a workflow's side effect."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Two separate questions, and reading one for the other is how a report-only run gets called a failed
      # search: `improved` is whether the search beat the weights it started from, which it reports whether or
      # not it was asked to apply anything; a branch is only pushed when it was.
      - name: What the search found
        id: found
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          improved="$(jq -r 'if .best.score > .initial.score then "true" else "false" end' "$OUT/search.json" 2>/dev/null || echo false)"
          if [[ "$improved" != "true" ]]; then
            echo "No candidate beat the weights the search started from."
          elif [[ "$APPLY" != "true" ]]; then
            echo "The search found better weights and was asked not to apply them. They are in the artifact."
          fi

          if [[ "$improved" == "true" && "$APPLY" == "true" ]]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
          else
            echo "applied=false" >> "$GITHUB_OUTPUT"
          fi

      # The one thing the search itself cannot establish. Every candidate played the same fixed seeds and the
      # winner was picked for scoring best on them, so its interval is the winner's and not a fair one. These
      # are seeds no candidate saw: a run of consecutive integers clear of every seed in the file. A seed file
      # may hold any distinct 32-bit integers, so the window goes above the largest seed when it fits in the
      # signed range and below the smallest otherwise -- `--seed` is parsed as an `int` and the engine adds to
      # it unchecked, so a window that ran past the maximum would fail the run, or wrap and land back on the
      # seeds it is supposed to avoid. The baseline is replayed on the same seeds as the control -- against
      # `greedy` it is even by construction, which is exactly what makes it a check on the seed set.
      #
      # Unseen seeds answer "did it fit the seed file" and cannot answer "did it fit the opponent", because
      # the opponent is the same on both sides. So both agents are replayed a second time against another
      # opponent, `random` by default: a set that beats the opponent it was searched against and scores below
      # what it started from here has learned that opponent rather than the game. The lookahead weights of
      # search run 5 were that set, 0.84 against Greedy and 0.70 against Random where Greedy itself scores
      # 0.99 (journal, 2026-09-16), and this step would have said so in the run summary.
      - name: Replay on seeds the search never saw
        if: steps.found.outputs.applied == 'true'
        id: holdout
        env:
          OPPONENT: ${{ inputs.opponent }}
          CHECK: ${{ inputs.check_opponent }}
          KIND: ${{ inputs.kind }}
          INITIAL: ${{ inputs.initial }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          matches="$(jq -r '.seeds | length' "$SEEDS")"
          start="$(jq -r --argjson n "$matches" '
            [.seeds[]] as $seeds
            | ($seeds | max) as $highest | ($seeds | min) as $lowest
            | if $highest + $n <= 2147483647 then $highest + 1
              elif $lowest - $n >= 0 then $lowest - $n
              else "none" end' "$SEEDS")"
          if [[ "$start" == "none" ]]; then
            echo "No window of $matches seeds fits clear of '$SEEDS' in the seed space." >&2
            exit 1
          fi
          replay() {
            dotnet run --project src/DownfallArena.Cli --no-build --configuration Release -- \
              evaluate --p1 "$1" --p2 "$2" --seed "$start" --matches "$matches" \
              --out "$OUT/holdout-$3.json" > "$OUT/holdout-$3.log"
          }
          # Agent A's mean score of two evaluations, the number the search optimized, so every column of the
          # table below is on one scale.
          scores() {
            jq -rs '[.[0].agentA.score.mean, .[1].agentA.score.mean] | @tsv' \
              "$OUT/holdout-$1.json" "$OUT/holdout-$2.json"
          }
          # The control is whatever the search started from, which is what "better" has to mean here: with no
          # `initial` that is the built-in weights, and `greedy` plays exactly those. Replaying `greedy`
          # against a search that started somewhere else would compare the found weights with an agent
          # neither the search nor the question was about.
          # Played by the kind the search played, so the control reads the same way as the found set: bare
          # `greedy` is the one-step reading of the built-in weights, and `lookahead` or `minimax` bare is
          # that reading of the same weights.
          started_from="$KIND"
          if [[ -n "$INITIAL" ]]; then
            started_from="$KIND:$INITIAL"
          elif [[ "$KIND" == "heuristic" ]]; then
            started_from=greedy
          fi
          header="| Agent |"
          rule="| --- |"
          found_row="| The weights it found |"
          baseline_row="| What it started from (\`$started_from\`) |"
          # column <opponent> <suffix>: both agents against one opponent, as one more column of the table.
          column() {
            replay "$KIND:$OUT/weights.json" "$1" "found$2"
            replay "$started_from" "$1" "baseline$2"
            read -r column_found column_baseline <<< "$(scores "found$2" "baseline$2")"
            header="$header Score against \`$1\` |"
            rule="$rule --- |"
            found_row="$found_row $column_found |"
            baseline_row="$baseline_row $column_baseline |"
          }
          # One column per opponent the search played, and the outputs are the mean over them, which is the
          # number the search optimized, with the constraint it optimized under read on fresh seeds: a
          # column where the found set scores below what it started from is named, because a mean can be won
          # by learning one opponent and the search's floor was measured on the seeds it searched. The first
          # opponent keeps the plain file names every run so far wrote.
          read -r -a opponents <<< "${OPPONENT//,/ }"
          found_sum=0
          baseline_sum=0
          fell=()
          for index in "${!opponents[@]}"; do
            suffix=""
            if (( index > 0 )); then
              suffix="-$index"
            fi
            column "${opponents[index]}" "$suffix"
            found_sum="$(jq -n --argjson a "$found_sum" --argjson b "$column_found" '$a + $b')"
            baseline_sum="$(jq -n --argjson a "$baseline_sum" --argjson b "$column_baseline" '$a + $b')"
            if jq -e -n --argjson f "$column_found" --argjson b "$column_baseline" '$f < $b' > /dev/null; then
              fell+=("${opponents[index]}")
            fi
          done
          found_score="$(jq -n --argjson s "$found_sum" --argjson n "${#opponents[@]}" '$s / $n')"
          baseline_score="$(jq -n --argjson s "$baseline_sum" --argjson n "${#opponents[@]}" '$s / $n')"
          echo "found=$found_score" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline_score" >> "$GITHUB_OUTPUT"
          echo "fell=${fell[*]-}" >> "$GITHUB_OUTPUT"
          check_note=""
          if (( ${#fell[@]} > 0 )); then
            check_note="Against ${fell[*]} the found set scores below what it started from: the mean it was chosen on was paid for there."
          fi
          # An opponent the search already played would be the same column twice, so the check only runs
          # against one it did not.
          if [[ -n "$CHECK" ]] && ! printf '%s\n' "${opponents[@]}" | grep -qxF -- "$CHECK"; then
            column "$CHECK" "-check"
            echo "check_found=$column_found" >> "$GITHUB_OUTPUT"
            echo "check_baseline=$column_baseline" >> "$GITHUB_OUTPUT"
            check_note="$check_note A found agent that beats \`$OPPONENT\` here and scores below what it started from against \`$CHECK\` has learned \`$OPPONENT\`, not the game."
          fi
          {
            echo
            echo "### On $matches seeds no candidate saw ($start to $((start + matches - 1)), mirrored)"
            echo
            echo "$header"
            echo "$rule"
            echo "$found_row"
            echo "$baseline_row"
            echo
            echo "This is the comparison the search's own numbers cannot make. A found agent that does not beat"
            echo "what it started from here has not been shown to be better at anything but the seed file it"
            echo "was searched on. $check_note"
          } >> "$GITHUB_STEP_SUMMARY"

      # The gate a contributor runs before pushing, and the one ci.yml runs. A weights file is content the test
      # projects copy to their output directory, so the build has to run again before the tests see it: with
      # `--no-build` they would read the copy from before this file existed.
      - name: Add the weights and run the gate
        if: steps.found.outputs.applied == 'true'
        run: |
          cp "$OUT/weights.json" "$FOUND"
          dotnet build --no-restore --configuration Release
          dotnet test --no-build --configuration Release
          dotnet format --verify-no-changes
          uv run --project learning --locked --no-sync --no-build python -m ruff check learning
          uv run --project learning --locked --no-sync --no-build python -m ruff format --check learning
          uv run --project learning --locked --no-sync --no-build python -m pytest learning/tests -q

      # The branch is pushed; the pull request is not opened here, and that is the point. A pull request opened
      # with GITHUB_TOKEN does not start the `pull_request` workflows, so it would arrive with no CI at all and
      # no SonarCloud quality gate -- which AGENTS.md requires on every pull request. Opening it from the link
      # below takes one tap and runs the repository's real checks. The branch holds one commit, so GitHub fills
      # the pull request in from its message: the proposal is already written for you.
      - name: Push the weights and link the pull request
        if: steps.found.outputs.applied == 'true'
        env:
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          BASE: ${{ github.ref_name }}
          OPPONENT: ${{ inputs.opponent }}
          CHECK: ${{ inputs.check_opponent }}
          KIND: ${{ inputs.kind }}
          INITIAL: ${{ inputs.initial }}
          SEEDS: ${{ inputs.seeds }}
          ITERATIONS: ${{ inputs.iterations }}
          POPULATION: ${{ inputs.population }}
          SEED: ${{ inputs.seed }}
          HOLDOUT_FOUND: ${{ steps.holdout.outputs.found }}
          HOLDOUT_BASELINE: ${{ steps.holdout.outputs.baseline }}
          HOLDOUT_CHECK_FOUND: ${{ steps.holdout.outputs.check_found }}
          HOLDOUT_CHECK_BASELINE: ${{ steps.holdout.outputs.check_baseline }}
          HOLDOUT_FELL: ${{ steps.holdout.outputs.fell }}
        run: |
          hash="$(jq -r '.contentHash // "unknown"' data/dst/game.schema.json)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add "$FOUND"

          # Written to a file: a -m here would carry this file's YAML indentation into the message. The body is
          # markdown because GitHub offers it as the pull request description.
          {
            echo "Add the weights of search run $RUN_NUMBER"
            echo
            echo "One weight search from [workflow run $RUN_NUMBER]($SERVER/$REPOSITORY/actions/runs/$RUN_ID),"
            echo "against \`$OPPONENT\` on \`$SEEDS\`, $ITERATIONS rounds of $POPULATION, seed \`$SEED\`,"
            echo "starting from \`${INITIAL:-the built-in weights}\`, every candidate played as \`$KIND\`."
            echo "Content hash \`$hash\`."
            echo
            echo '```'
            cat "$OUT/search.log"
            echo '```'
            echo
            echo "**On seeds no candidate saw**, which is the one comparison the run above cannot make:"
            echo "these weights score \`$HOLDOUT_FOUND\` against \`$OPPONENT\` where what the search started"
            echo "from scores \`$HOLDOUT_BASELINE\` (the mean over the opponents when there are several${HOLDOUT_FELL:+; below what it started from against $HOLDOUT_FELL})."
            if [[ -n "$HOLDOUT_CHECK_FOUND" ]]; then
              echo "**Against \`$CHECK\`**, an opponent the search never played, they score"
              echo "\`$HOLDOUT_CHECK_FOUND\` where what it started from scores \`$HOLDOUT_CHECK_BASELINE\`: a set"
              echo "that wins the first comparison and loses this one learned \`$OPPONENT\`, not the game."
            fi
            echo
            echo "This adds \`$FOUND\`. It does **not** move the baseline: \`ScoringWeights.Default\` and"
            echo "\`learning/weights/greedy.json\` are untouched, so every benchmark and every journal entry stays"
            echo "comparable. Play it with \`evaluate --p1 $KIND:$FOUND\`: weights searched for one reading are"
            echo "only meaningful played by it."
            echo
            echo "Before merging:"
            echo
            echo "- **A journal entry.** This carries numbers, not a reason (ADR 0013). The output above is what"
            echo "  an entry needs."
            echo "- **The hold-out above is one comparison, not a verdict.** It replays both agents on fresh"
            echo "  seeds, which is what the search's own interval cannot do -- those weights were picked for"
            echo "  scoring best out of $ITERATIONS rounds of $POPULATION on one fixed seed file. A gap inside"
            echo "  the noise of 400 matches is not a gap."
            echo
            echo "The search is deterministic: the same seed on the same content and the same engine returns the"
            echo "same weights, so this reproduces locally with \`search-weights --seed $SEED --iterations"
            echo "$ITERATIONS --population $POPULATION --opponent $OPPONENT --kind $KIND --seeds $SEEDS${INITIAL:+ --initial $INITIAL}\`."
          } > "$RUNNER_TEMP/message.txt"
          git commit -F "$RUNNER_TEMP/message.txt"
          git push origin "$BRANCH"

          {
            echo
            echo "### The weights are on \`$BRANCH\`"
            echo
            echo "**[Open it as a pull request]($SERVER/$REPOSITORY/compare/$BASE...$BRANCH?expand=1)** — one tap,"
            echo "and the description is already filled in from the commit."
            echo
            echo "It is not opened here on purpose: a pull request opened by a workflow does not start the"
            echo "repository's own checks, so it would arrive with no CI and no SonarCloud quality gate."
            echo "Opened by a person, it gets both."
            echo
            echo "The build, the tests and the format check all passed on this branch before it was pushed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the search
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-${{ github.run_number }}
          path: |
            runs/search-${{ github.run_number }}/search.log
            runs/search-${{ github.run_number }}/weights.json
            runs/search-${{ github.run_number }}/search.json
            runs/search-${{ github.run_number }}/evaluation*.json
            runs/search-${{ github.run_number }}/training.jsonl
            runs/search-${{ github.run_number }}/holdout-*.json
          if-no-files-found: warn
          retention-days: 30
