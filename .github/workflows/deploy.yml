name: Deploy the table

# A deployment asked by hand (Run workflow): the image of the chosen commit is built, tried and pushed
# (image.yml), then rolled out (rollout.yml), without waiting for anything. It is the way back to an older
# commit, and the first deployment of infra/README.md. A merge to main does not come through here: CI calls
# the same two workflows itself, the rollout behind its gate (ADR 0182).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: image
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: true

  deploy:
    name: deploy
    needs: image
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rollout.yml
    with:
      image: ${{ needs.image.outputs.image }}
    secrets:
      TABLE_PUSH_KEYS: ${{ secrets.TABLE_PUSH_KEYS }}
      TABLE_ALERT_EMAIL: ${{ secrets.TABLE_ALERT_EMAIL }}
