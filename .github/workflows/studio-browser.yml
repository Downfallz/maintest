        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-browser-${{ matrix.project }}
          path: studio/browser/test-results
          retention-days: 7
  # The complete matches in the release profiles (battle.release.config.js), one job per profile, side by side:
  # one test at a time they took twenty-five minutes in one job, the longest of the run. A pull request plays
  # WebKit alone, the one engine no other job plays; main and the nightly play the three (ADR 0190).
