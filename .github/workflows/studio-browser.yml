    # The name keeps `battle-release`: scripts/workflow-metrics.py groups the minutes by it.
    name: battle-release (${{ matrix.profile }})
    if: inputs.release != 'none'
    runs-on: ubuntu-latest
    env:
      ENGINE: ${{ matrix.profile == 'release-ios' && 'webkit' || 'chromium' }}
    # A complete match takes two minutes on desktop and three on an emulated phone; WebKit's system packages
    # and the build come on top.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(inputs.release == 'webkit' && '["release-ios"]' || '["release-desktop","release-android","release-ios"]') }}
