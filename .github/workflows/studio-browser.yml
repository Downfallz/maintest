name: Studio browser
on:
  pull_request:
    paths:
      - 'studio/**'
      - 'table/**'
      - 'arena/**'
      - 'src/**'
      - 'viewer/viewer.css'
      - 'data/**'
      - '.github/workflows/studio-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    # The three projects of the five arena suites and the table suites took fourteen minutes on the run that
    # added the complete loop (#432), and its real-host journeys, two of them a whole 3v3 match driven
    # through the arena, were cut off at the twenty-minute budget that held since playback (#431). With the
    # growth (AU8) and order (AU11) suites the mobile and desktop journeys alone took seventeen to twenty-five
    # minutes depending on the runner, and the real-engine journeys after them were cut off at thirty (#458).
    # AU13 brought the whole job to thirty-eight to forty minutes, and AU14's keyboard journeys and longer
    # complete matches add about five more: forty-five would cut them off on a slow runner (#464).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        working-directory: studio/browser
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the isolated arena prototype
        run: npm --prefix arena ci --ignore-scripts && npm --prefix arena run build

      - name: Build the practice host and catalogue
        run: |
          dotnet build src/DownfallArena.Cli
          dotnet run --project tools/DownfallArena.DataBuilder -- data data/dst
      - name: Verify mobile and desktop journeys
        working-directory: studio/browser
        run: npm test
      - name: Verify practice journeys with the real engine
        working-directory: studio/browser
        run: node node_modules/playwright/cli.js test --config table.config.js
      - name: Keep previews and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-browser
          path: studio/browser/test-results
          retention-days: 7
  arena-release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release browser engines
        working-directory: studio/browser
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium webkit
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build release candidate and check asset budgets
        run: |
          npm --prefix arena ci --ignore-scripts && npm --prefix arena run build
          dotnet build src/DownfallArena.Cli
          dotnet run --project tools/DownfallArena.DataBuilder -- data data/dst
      - name: Play complete matches in desktop, Android and iOS browser profiles
        working-directory: studio/browser
        run: node node_modules/playwright/cli.js test --config arena.release.config.js
      - name: Keep release measurements and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arena-release
          path: studio/browser/test-results
          retention-days: 7
