name: Studio browser
on:
  pull_request:
    paths:
      - 'studio/**'
      - 'table/**'
      - 'battle/**'
      - 'src/**'
      # Not the console commands no page reaches -- play, human, evaluate (ADR 0167).
      - '!src/DownfallArena.Cli/ConsoleAgent.cs'
      - '!src/DownfallArena.Cli/ConsoleMatchLog.cs'
      - '!src/DownfallArena.Cli/EvaluationConsole.cs'
      - 'viewer/viewer.css'
      - 'data/**'
      - '.github/workflows/studio-browser.yml'
      # Last, so no pattern above takes it back: Markdown is read by no page and no spec.
      - '!**/*.md'
  workflow_dispatch:
permissions:
  contents: read
# A newer push to the same pull request makes a running check of the older one moot: each push queued a whole
# run of these jobs beside the last, and five of them at once held every runner a branch could get.
concurrency:
  group: studio-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # The mock-host journeys, one job per Playwright project, side by side. As one step they took thirty-five to
  # forty-seven minutes after AU14 and #504 (the complete-match replay waiting out a hidden list, fixed in #503,
  # pushed them past sixty), with the real-engine journeys' eleven after them in a sixty-minute job. A project
  # takes about a quarter of that; tablet runs only table.ux.spec.js, so it shares the desktop job. Desktop runs the
  # most journeys, 476 with tablet's, which took 18 to 20 minutes and on a loaded runner ran past the thirty, so
  # it is played in two halves (Playwright's --shard), each well inside the limit.
  journeys:
    name: journeys (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: small-phone
            projects: --project=small-phone
          - name: phone
            projects: --project=phone
          - name: desktop and tablet 1/2
            projects: --project=desktop --project=tablet --shard=1/2
          - name: desktop and tablet 2/2
            projects: --project=desktop --project=tablet --shard=2/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        working-directory: studio/browser
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium
      # These journeys answer every request from a mock host (server.js and page routes): no .NET build.
      - name: Build the isolated battle prototype
        run: npm --prefix battle ci --ignore-scripts && npm --prefix battle run build
      - name: Verify the journeys of this project
        working-directory: studio/browser
        env:
          PROJECTS: ${{ matrix.projects }}
        run: node node_modules/playwright/cli.js test $PROJECTS
      - name: Keep previews and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-browser-${{ strategy.job-index }}
          path: studio/browser/test-results
          retention-days: 7
  # The practice, slot, push and complete-match journeys against the real engine, one job per project: each
  # plays one table at a time (workers: 1), so the two projects only add up when they share a job.
  real-engine:
    name: real engine (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [table-phone, table-desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install browser test dependencies
        working-directory: studio/browser
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build the isolated battle prototype
        run: npm --prefix battle ci --ignore-scripts && npm --prefix battle run build
      - name: Build the practice host and catalogue
        run: |
          dotnet build src/DownfallArena.Cli
          dotnet run --project tools/DownfallArena.DataBuilder -- data data/dst
      - name: Verify practice journeys with the real engine
        working-directory: studio/browser
        run: node node_modules/playwright/cli.js test --config table.config.js --project=${{ matrix.project }}
      - name: Keep previews and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-browser-${{ matrix.project }}
          path: studio/browser/test-results
          retention-days: 7
  # The check a pull request has always waited on: green only when every journey job above is.
  browser:
    runs-on: ubuntu-latest
    needs: [journeys, real-engine]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every journey job passed
        env:
          JOURNEYS: ${{ needs.journeys.result }}
          REAL_ENGINE: ${{ needs.real-engine.result }}
        run: |
          echo "journeys: $JOURNEYS, real engine: $REAL_ENGINE"
          test "$JOURNEYS" = success && test "$REAL_ENGINE" = success
  battle-release:
    runs-on: ubuntu-latest
    # Two of the three profiles took nine minutes in a container on main after AU14 (complete matches are
    # two minutes each); WebKit's system packages and the build come on top of the third.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install release browser engines
        working-directory: studio/browser
        run: |
          npm ci --ignore-scripts
          node node_modules/playwright/cli.js install --with-deps chromium webkit
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Build release candidate and check asset budgets
        run: |
          npm --prefix battle ci --ignore-scripts && npm --prefix battle run build
          dotnet build src/DownfallArena.Cli
          dotnet run --project tools/DownfallArena.DataBuilder -- data data/dst
      - name: Play complete matches in desktop, Android and iOS browser profiles
        working-directory: studio/browser
        run: node node_modules/playwright/cli.js test --config battle.release.config.js
      - name: Keep release measurements and screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: battle-release
          path: studio/browser/test-results
          retention-days: 7
