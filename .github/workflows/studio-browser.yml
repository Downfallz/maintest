name: Studio browser

# The browser suite: the mock-host journeys, the real-engine journeys and the release profiles. CI calls it with
# what the diff calls for (ADR 0182, studio/browser/plan.js), on pull requests and on main; nightly.yml, and a run
# asked by hand, play the whole matrix. It has no path filter of its own: the plan is the filter, and it is
# decided inside a run so that the gate always reports.
on:
  workflow_call:
    inputs:
      journeys:
        description: The mock-host specs to play, separated by spaces; `all`, or `none`.
        type: string
        default: all
      journey-jobs:
        description: The journeys jobs that have something to play, as a JSON list of their names (plan.js); `all`.
        type: string
        default: all
      real-engine:
        description: Whether to play the journeys against the real engine.
        type: boolean
        default: true
      release:
        description: The release profiles to play, `all`, `webkit` (a pull request's, ADR 0190) or `none`.
        type: string
        default: all
  # The same inputs, with the same defaults: a dispatch that declared none would read each as empty, and an
  # empty input is equal to `false`, so a run asked by hand would skip the real engine and the release profiles.
  workflow_dispatch:
    inputs:
      journeys:
        description: The mock-host specs to play, separated by spaces; `all`, or `none`.
        type: string
        default: all
      journey-jobs:
        description: The journeys jobs to start, as a JSON list of their names (plan.js); `all`.
        type: string
        default: all
      real-engine:
        description: Play the journeys against the real engine.
        type: boolean
        default: true
      release:
        description: The release profiles to play.
        type: choice
        options: [all, webkit, none]
        default: all
permissions:
  contents: read
jobs:
  # The mock-host journeys, a job or two per Playwright project, side by side. As one step they took thirty-five to
  # forty-seven minutes after AU14 and #504 (the complete-match replay waiting out a hidden list, fixed in #503,
  # pushed them past sixty), with the real-engine journeys' eleven after them in a sixty-minute job. A project
  # takes about a quarter of that; tablet runs only table.ux.spec.js, so it shares the desktop job. Desktop runs the
  # most journeys, 520 with tablet's, which took 18 to 20 minutes and on a loaded runner ran past the thirty. It
  # was played in two halves (Playwright's --shard), which took 13 and 21 minutes, because a shard splits by test
  # count and three specs hold a third of the time: battle-playback, battle-pacing and battle-live. Those three
  # play in a job of their own (--grep matches a test's file), and the rest in two halves without them (the same
  # pattern in --grep-invert), so every test plays once. Measured on 4 vCPU and two workers, 2026-11-16, the
  # three jobs' tests took 748, 660 and 699 seconds where the two halves' took 862 and 1,245
  # (docs/engineering/ci-minutes-plan.md, M3). A spec that grows that heavy joins the pattern. The jobs, their
  # arguments and the pattern are plan.js's (JOURNEY_JOBS), and CI starts only the jobs the planned specs play in
  # (journey-jobs, M4): a pull request that touches no heavy spec does not set up `desktop replays` to play nothing.
  # Each phone plays in two halves too: on main from 2026-11-19 to 11-22 the phone's one job took 22 minutes at the
  # median and hit its thirty 9 times in 53 runs, and the small phone's took up to 24 (#1003).
  journeys:
    name: journeys (${{ matrix.name }})
    # An empty list is no matrix at all, which GitHub refuses: the job is skipped first.
    if: inputs.journeys != 'none' && inputs.journey-jobs != '[]'
    runs-on: ubuntu-latest
    env:
      ENGINE: chromium
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: ${{ fromJSON(inputs.journey-jobs == 'all' && '["small-phone 1/2","small-phone 2/2","phone 1/2","phone 2/2","desktop replays","desktop and tablet 1/2","desktop and tablet 2/2"]' || inputs.journey-jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Playwright's browsers are kept between runs, keyed by the runner's image, Playwright's version and the
      # engine (the job's ENGINE), so a run downloads an engine only when one of those moved. The system packages
      # are installed every time (`--with-deps`), from the archives kept below: a fresh runner has none.
      # A miss is saved straight after the install, before the battle build and the specs run. What keeps a pull
      # request from planting a browser is the cache's scope: its run saves under its own ref, which main never
      # reads, and a pull request reads main's.
      - name: Install the test dependencies and name the browsers' cache
        id: playwright
        working-directory: studio/browser
        run: |
          npm ci --ignore-scripts
          version=$(node -p "require('./node_modules/playwright/package.json').version")
          echo "key=playwright-$ImageOS-$version-$ENGINE" >> "$GITHUB_OUTPUT"
          echo "debs-key=playwright-debs-$ImageOS-$ENGINE-$version-$ImageVersion-$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
          echo "debs-prefix=playwright-debs-$ImageOS-$ENGINE-" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright's browsers
        id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      # The system packages' archives are kept too (#892). WebKit needs 185 system packages (140 MB) that a fresh
      # runner lacks, and the Ubuntu mirror sometimes sends only one every few seconds: 5 of 42 release-ios jobs on
      # main were cancelled in the install. apt looks in its own cache first, checks each archive against the signed
      # index, and fetches only what is missing or newer. The key changes with the image, Playwright's version and
      # the week, so the updates published since the image are kept too; a new key starts from the newest archives
      # of the same engine. An install that fails keeps what it fetched, under a key of its own run, for the next
      # run to start from. The install is capped at 10 minutes, so a slow mirror fails the job early.
      - name: Restore the system packages' archives
        id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.playwright.outputs.debs-key }}
          restore-keys: ${{ steps.playwright.outputs.debs-prefix }}
      - name: Install the browser engine and its system packages
        working-directory: studio/browser
        timeout-minutes: 10
        run: |
          # Every slow install had a runner whose image names the regional EC2 mirror; every fast one, Azure's (#892).
          mirrors=$(grep -rlE '[a-z0-9-]+\.ec2\.archive\.ubuntu\.com' /etc/apt || true)
          if [[ -n "$mirrors" ]]; then
            echo "Fetching from Azure's Ubuntu mirror instead of the EC2 one named in: $mirrors"
            echo "$mirrors" | xargs sudo sed -i -E 's#https?://[a-z0-9-]+\.ec2\.archive\.ubuntu\.com/#https://azure.archive.ubuntu.com/#g'
          fi
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/90keep-archives > /dev/null
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p ~/.cache/playwright-debs
          find ~/.cache/playwright-debs -name '*.deb' -exec sudo cp -t /var/cache/apt/archives {} +
          node node_modules/playwright/cli.js install --with-deps "$ENGINE"
      - name: Keep Playwright's browsers for the next run
        if: steps.browsers.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright.outputs.key }}
      # Only a saving: a failure here leaves the job as it was.
      - name: Keep the system packages' archives for the next run
        if: ${{ !cancelled() && steps.debs.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          # An install stopped at its limit leaves its apt running as root, holding the archives' lock.
          sudo pkill -x apt-get || true
          sudo apt-get -o DPkg::Lock::Timeout=30 autoclean -qq || true
          find ~/.cache/playwright-debs -name '*.deb' -delete
          find /var/cache/apt/archives -maxdepth 1 -name '*.deb' -exec cp -t ~/.cache/playwright-debs {} +
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: ${{ !cancelled() && steps.debs.outputs.cache-hit != 'true' }}
        continue-on-error: true
        with:
          path: ~/.cache/playwright-debs
          key: ${{ steps.playwright.outputs.debs-key }}${{ job.status == 'failure' && format('-partial-{0}', github.run_id) || '' }}
      # These journeys answer every request from a mock host (server.js and page routes): no .NET build.
      - name: Build the isolated battle prototype
        run: npm --prefix battle ci --ignore-scripts && npm --prefix battle run build
      # One retry (ADR 0182): a journey that fails twice is red, one that passes the second time is green and
      # named by the step below. The specs are the ones the diff calls for; a shard they leave empty passes.
      # SPECS is unquoted on purpose: it is several arguments. The job's own arguments come one a line from the
      # plan, so its grep pattern reaches Playwright as it is written.
      - name: Verify the journeys of this project
        working-directory: studio/browser
        env:
          NAME: ${{ matrix.name }}
          SPECS: ${{ (inputs.journeys == 'all' || inputs.journeys == '') && ' ' || inputs.journeys }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-report.json
        run: |
          mapfile -t projects < <(node plan.js --journey-job "$NAME")
          [[ ${#projects[@]} -gt 0 ]] || exit 1
          node node_modules/playwright/cli.js test $SPECS "${projects[@]}" --retries=1 --pass-with-no-tests --reporter=dot,json
      - name: Say what flaked
        if: ${{ !cancelled() }}
        run: |
          if [[ -f "$RUNNER_TEMP/playwright-report.json" ]]; then
            node studio/browser/flakes.js < "$RUNNER_TEMP/playwright-report.json"
          else
            echo "No Playwright report to read: no test ran."
          fi
      - name: Keep previews and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: studio-browser-${{ strategy.job-index }}
          path: studio/browser/test-results
          retention-days: 7
  # The practice, slot, push and complete-match journeys against the real engine, one job per project: each
  # plays one table at a time (workers: 1), so the two projects only add up when they share a job.
  real-engine:
    name: real engine (${{ matrix.project }})
    if: inputs.real-engine
    runs-on: ubuntu-latest
    env:
      ENGINE: chromium
    # The checks of accessibility (table.access.js, UX13) walk every journey at two widths: about eight minutes a
    # project on top of the twelve the job took before them.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        project: [table-phone, table-desktop]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Playwright's browsers are kept between runs, keyed by the runner's image, Playwright's version and the
      # engine (the job's ENGINE), so a run downloads an engine only when one of those moved. The system packages
      # are installed every time (`--with-deps`), from the archives kept below: a fresh runner has none.
      # A miss is saved straight after the install, before the battle build and the specs run. What keeps a pull
      # request from planting a browser is the cache's scope: its run saves under its own ref, which main never
      # reads, and a pull request reads main's.
      - name: Install the test dependencies and name the browsers' cache
        id: playwright
        working-directory: studio/browser
