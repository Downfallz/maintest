        with:
          global-json-file: global.json
      - name: Build release candidate and check asset budgets
        run: |
          npm --prefix battle ci --ignore-scripts && npm --prefix battle run build
          dotnet build src/DownfallArena.Cli
          dotnet run --project tools/DownfallArena.DataBuilder -- data data/dst
      - name: Play complete matches in this profile
        working-directory: studio/browser
        env:
          PROFILE: ${{ matrix.profile }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ runner.temp }}/playwright-report.json
        run: node node_modules/playwright/cli.js test --config battle.release.config.js --project="$PROFILE" --retries=1 --reporter=dot,json
