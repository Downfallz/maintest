            echo "$mirrors" | xargs sudo sed -i -E 's#https?://[a-z0-9-]+\.ec2\.archive\.ubuntu\.com/#https://azure.archive.ubuntu.com/#g'
          fi
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/90keep-archives > /dev/null
