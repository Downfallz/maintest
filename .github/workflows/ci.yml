name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # The learning project (learning/, ADR 0013) has its own gate: ruff and pytest under uv.
  learning:
    name: Lint and test the learning project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The virtual environment lives outside the checkout, so nothing under learning/ is generated.
      - name: Install uv
        run: |
          pipx install uv==0.8.17
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/learning-venv" >> "$GITHUB_ENV"

      # Only the locked wheels of the dependencies are installed, so no build script of any package runs; the
      # tests import the project from src/ (pyproject pythonpath) and the tools run from that environment.
      - name: Install the dependencies from the lock file
        run: uv sync --locked --no-build --no-install-project

      - name: Lint and format check
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/ruff" check .
          "$UV_PROJECT_ENVIRONMENT/bin/ruff" format --check .

      - name: Test with coverage
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/pytest" --cov=downfall_learning --cov=tests --cov-report=term

  build-and-test:
    name: Build, format check, test, analyse
    runs-on: ubuntu-latest
    env:
      # Sonar steps are skipped when the token is absent (forks, or the secret not configured yet).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: Downfallz_maintest
      SONAR_ORGANIZATION: downfallz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so SonarCloud can attribute new code and blame lines.
          fetch-depth: 0

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore packages and tools
        run: |
          dotnet restore
          dotnet tool restore

      - name: Test the studio page
        # Unquoted on purpose: `node --test` only expands a glob itself on Node 22+, and this workflow
        # pins no version, so the shell does it and the step works on whatever Node the runner ships.
        run: node --test studio/*.test.js

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      # Coverage is not demanded of the composition root (wiring, exercised by running the app) nor of the two
      # static pages (ADR 0013 decision J, ADR 0015). The studio's modules do have tests now, run by the step
      # above, but Node's coverage does not reach Sonar (ADR 0024); the viewer still has no runner at all.
      # Sonar analyses all of them for bugs and code smells either way.
      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/*.xml"
          /d:sonar.exclusions="legacy/**,artifacts/**,**/.venv/**"
          /d:sonar.coverage.exclusions="src/DownfallArena.Cli/**,tools/**,studio/**,viewer/**"
          /d:sonar.python.version="3.11,3.12,3.13"
          /d:sonar.python.coverage.reportPaths="$RUNNER_TEMP/learning-coverage.xml"

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test --no-build --configuration Release -- --coverage --coverage-output-format xml

      - name: Build game content
        run: dotnet run --project tools/DownfallArena.DataBuilder --no-build --configuration Release -- data data/dst

      # The engine-change detector (ADR 0013): the benchmark seeds must replay to the committed digest of this content.
      - name: Verify benchmark digest
        run: dotnet run --project src/DownfallArena.Cli --no-build --configuration Release -- benchmark

      # The learning job is the gate for the Python side; this run only produces the coverage report the
      # Sonar analysis of this job imports, so the quality gate sees the Python code with its coverage.
      - name: Test the learning project for its coverage report
        working-directory: learning
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/learning-venv
        run: |
          pipx install uv==0.8.17
          uv sync --locked --no-build --no-install-project
          "$UV_PROJECT_ENVIRONMENT/bin/pytest" --cov=downfall_learning --cov=tests --cov-report=xml:"$RUNNER_TEMP/learning-coverage.xml" -q

      - name: End SonarCloud analysis
        if: env.SONAR_TOKEN != '' && !cancelled()
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Report SonarCloud quality gate and issues
        if: env.SONAR_TOKEN != '' && !cancelled()
        env:
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: .github/scripts/sonar-report.sh

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: warn
