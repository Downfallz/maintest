name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request makes the run of the older one moot. On main nothing is cancelled half-way:
# the runs queue, in the order of the merges, so a deployment never lands under an older one, and a run the
# next merge replaces in the queue is answered for by that merge's run, which reads everything since main was
# last green (ADR 0182).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # What this run has to play (ADR 0182): the browser journeys and the image are slow, and most changes read
  # neither. Decided here, in a job that always runs, and never by a path filter on the workflow: a workflow
  # that is filtered out reports no check, and the pull request waits for one that never comes.
  changes:
    name: What the diff calls for
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # The last green run on main, which is where a push's diff starts.
      actions: read
    outputs:
      journeys: ${{ steps.plan.outputs.journeys }}
      real-engine: ${{ steps.plan.outputs.real-engine }}
      release: ${{ steps.plan.outputs.release }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The diff is read from the history: a pull request's merge commit, or main since it was last green.
          fetch-depth: 0

      - name: Plan the run from the changed paths
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          status=0
          .github/scripts/changed-paths.sh > "$RUNNER_TEMP/changed.txt" || status=$?
          if [[ "$status" == 3 ]]; then
            echo "No diff to read: this run plays everything."
            node studio/browser/plan.js --all | tee -a "$GITHUB_OUTPUT"
          elif [[ "$status" == 0 ]]; then
            echo "$(wc -l < "$RUNNER_TEMP/changed.txt") changed path(s):"
            cat "$RUNNER_TEMP/changed.txt"
            node studio/browser/plan.js < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
          else
            exit "$status"
          fi

  # The learning project (learning/, ADR 0013) has its own gate: ruff and pytest under uv.
  learning:
    name: Lint and test the learning project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: learning
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The virtual environment lives outside the checkout, so nothing under learning/ is generated.
      - name: Install uv
        run: |
          pipx install uv==0.8.17
          echo "UV_PROJECT_ENVIRONMENT=$RUNNER_TEMP/learning-venv" >> "$GITHUB_ENV"

      # Only the locked wheels of the dependencies are installed, so no build script of any package runs; the
      # tests import the project from src/ (pyproject pythonpath) and the tools run from that environment.
      - name: Install the dependencies from the lock file
        run: uv sync --locked --no-build --no-install-project

      # ../scripts holds Python tools that import this project (sweep-weight.py, ADR 0037) and are not
      # part of it. They are linted under this project's ruff configuration so they cannot drift from
      # the style the rest of the Python here is held to.
      - name: Lint and format check
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/ruff" check . ../scripts
          "$UV_PROJECT_ENVIRONMENT/bin/ruff" format --check . ../scripts

      - name: Test with coverage
        run: |
          "$UV_PROJECT_ENVIRONMENT/bin/pytest" --cov=downfall_learning --cov=tests --cov-report=term

  build-and-test:
    name: Build, format check, test, analyse
    runs-on: ubuntu-latest
    env:
      AZURITE_BLOB_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
      AZURITE_QUEUE_ENDPOINT: http://127.0.0.1:10001/devstoreaccount1
      AZURITE_TABLE_ENDPOINT: http://127.0.0.1:10002/devstoreaccount1
      # Sonar steps are skipped when the token is absent (forks, or the secret not configured yet).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: Downfallz_maintest
      SONAR_ORGANIZATION: downfallz
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so SonarCloud can attribute new code and blame lines.
          fetch-depth: 0

      # The storage emulator the blob and table adapters are tested against (ADR 0080, ADR 0161). Without it
      # those tests skip and say so; here they run. Started by hand rather than as a service container, because
      # a service takes no arguments and the emulator needs one: it refuses a request whose API version is newer
      # than the ones it knows, which is every request once the Azure SDK is ahead of the emulator's last
      # release. Waited for here, every service, because a test that finds no emulator skips, and a skipped
      # test is green.
      - name: Start the storage emulator
        run: |
          docker run --detach --name azurite --publish 10000:10000 --publish 10001:10001 --publish 10002:10002 mcr.microsoft.com/azure-storage/azurite \
            azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
          for port in 10000 10001 10002; do
            for _ in $(seq 1 30); do
              if (exec 3<>/dev/tcp/127.0.0.1/$port) 2>/dev/null; then
                continue 2
              fi
              sleep 1
            done
            docker logs azurite
            echo "The storage emulator did not answer on $port: its tests would be skipped, not run." >&2
            exit 1
          done

      - name: Build the isolated battle prototype
        run: npm --prefix battle ci --ignore-scripts && npm --prefix battle run build

      - name: Set up .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore packages and tools
        run: |
          dotnet restore
          dotnet tool restore

      - name: Test the static pages
        # Unquoted on purpose: `node --test` only expands a glob itself on Node 22+, and this workflow
        # pins no version, so the shell does it and the step works on whatever Node the runner ships.
        run: node --test studio/*.test.js table/*.test.js

      - name: Format check
        run: dotnet format --verify-no-changes --no-restore

      # Coverage is not demanded of the composition root (wiring, exercised by running the app) nor of the
      # static pages (ADR 0013 decision J, ADR 0015). The studio's and the table's modules do have tests now,
      # run by the step above, but Node's coverage does not reach Sonar (ADR 0024) -- so a page with tests and
      # a page without one measure the same here; the viewer still has no runner at all.
      # The showcase is a static site of the same kind (ADR 0185), tested by studio/showcase.test.js. Its
      # copy, lore and privacy modules hold the English and French texts side by side under the same keys,
      # which the duplication detector reads as copies, so they are left out of it.
      # Sonar analyses all of them for bugs and code smells either way.
      #
      # The one suppression, and why it is one rather than a fix. `python:S1244` ("do not perform equality
      # checks with floating point values") is typed as a *bug*, so it drives `new_reliability_rating`, and
      # it fired eighteen times in `learning/tests/`. Every one of them compares a value whose exactness is
      # the specification: a fixture literal (0.75, 0.5, 9.5, 8.0 -- several of them exactly representable in
      # binary and incapable of carrying representation error), a number round-tripped through JSON, or
      # `Knob.moved`, whose documented contract is to round to three decimals. Rewriting those to
      # `pytest.approx` would delete what the assertion is for. Scoped to the test suite alone on purpose:
      # production code under `learning/src` still gets the rule, where a computed float really is a hazard.
      #
      # This is what had `main` red on every push since 2026-09-13 while every pull request was green: a PR
      # analysis reads only its own diff, a branch analysis reads the whole new-code period, and nobody reads
      # push runs.
      #
      # The second ignore, `csharpsquid:S5332` ("using http protocol is insecure") on `HttpHost.cs` alone. The
      # rule is right about the protocol and there is no fix to make: the table serves two phones on a home
      # network for an evening (ADR 0054), and HTTPS there means a certificate those phones trust, which means
      # running a certificate authority to protect a seat token on a link between a laptop and a phone in the
      # same room. ADR 0054 took that trade explicitly when it took leaving the loopback address, and named the
      # fence it keeps instead: a seat token on every route, held by `TableApiTests`. Scoped to the one file
      # that writes a prefix; anything else in this repository that reaches for `http://` still gets the rule.
      # The pattern starts at `**/` because the scanner for .NET analyses each project as a module and matches
      # a file's path from its project's folder: written from the repository root it matched nothing, and the
      # two issues stayed open on `main` while every pull request, which reads only its diff, was green.
      - name: Begin SonarCloud analysis
        if: env.SONAR_TOKEN != ''
        run: >
          dotnet sonarscanner begin
          /k:"$SONAR_PROJECT_KEY"
          /o:"$SONAR_ORGANIZATION"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.vscoveragexml.reportsPaths="TestResults/*.xml"
          /d:sonar.exclusions="legacy/**,artifacts/**,**/.venv/**,table/battle-build/**"
          /d:sonar.coverage.exclusions="src/DownfallArena.Cli/**,tools/**,studio/**,table/**,viewer/**,battle/**,scripts/**,showcase/**"
          /d:sonar.cpd.exclusions="showcase/copy.mjs,showcase/lore.mjs,showcase/privacy.mjs"
          /d:sonar.python.version="3.11,3.12,3.13"
          /d:sonar.python.coverage.reportPaths="$RUNNER_TEMP/learning-coverage.xml"
          /d:sonar.issue.ignore.multicriteria="e1,e2"
          /d:sonar.issue.ignore.multicriteria.e1.ruleKey="python:S1244"
          /d:sonar.issue.ignore.multicriteria.e1.resourceKey="learning/tests/**/*.py"
          /d:sonar.issue.ignore.multicriteria.e2.ruleKey="csharpsquid:S5332"
          /d:sonar.issue.ignore.multicriteria.e2.resourceKey="**/Hosting/HttpHost.cs"

      - name: Build (warnings are errors)
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test --no-build --configuration Release -- --coverage --coverage-output-format xml

      - name: Build game content
        run: dotnet run --project tools/DownfallArena.DataBuilder --no-build --configuration Release -- data data/dst

      # The engine-change detector (ADR 0013): the benchmark seeds must replay to the committed digest of this content.
      - name: Verify benchmark digest
        run: dotnet run --project src/DownfallArena.Cli --no-build --configuration Release -- benchmark

      # The learning job is the gate for the Python side; this run only produces the coverage report the
      # Sonar analysis of this job imports, so the quality gate sees the Python code with its coverage.
      - name: Test the learning project for its coverage report
        working-directory: learning
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/learning-venv
        run: |
          pipx install uv==0.8.17
          uv sync --locked --no-build --no-install-project
          "$UV_PROJECT_ENVIRONMENT/bin/pytest" --cov=downfall_learning --cov=tests --cov-report=xml:"$RUNNER_TEMP/learning-coverage.xml" -q

      - name: End SonarCloud analysis
        if: env.SONAR_TOKEN != '' && !cancelled()
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Report SonarCloud quality gate and issues
        if: env.SONAR_TOKEN != '' && !cancelled()
        env:
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
          SONAR_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: .github/scripts/sonar-report.sh

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/**
          if-no-files-found: warn

      # A service container's log is printed when its job ends; one started by hand is not, and it is where
      # a refused request says why.
      - name: Show the storage emulator's log
        if: failure()
        run: docker logs azurite || true

  # The browser suite (studio-browser.yml), for what the diff calls for: on a pull request, and on main, where
  # a journey red after a merge used to be found by the next pull request.
  browser:
    name: browser
    needs: changes
    if: needs.changes.outputs.journeys != 'none' || needs.changes.outputs.real-engine == 'true' || needs.changes.outputs.release == 'true'
    uses: ./.github/workflows/studio-browser.yml
    with:
      journeys: ${{ needs.changes.outputs.journeys }}
      real-engine: ${{ needs.changes.outputs.real-engine == 'true' }}
      release: ${{ needs.changes.outputs.release == 'true' }}

  # The table's image, built and tried when the diff touches what it carries; on main it is also pushed, under
  # its commit, for the deployment below to name.
  image:
    name: image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      push: ${{ github.event_name == 'push' }}

  # The one check the ruleset on main requires (ADR 0182). It always reports, whatever the diff: a job the
  # plan skipped is not a failure, a failed or cancelled one is. A job added above joins `needs`, which
  # studio/browser-suite.test.js holds.
  gate:
    name: gate
    runs-on: ubuntu-latest
    needs: [changes, learning, build-and-test, browser, image]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Every job this run called for passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # Production follows main only once main is green: the deployment waits for the gate, the browser suite
  # included, and runs when the image was rebuilt, which is when something the image carries changed.
  deploy:
    name: deploy
    needs: [gate, image]
    # Spelled out, because a job the plan skipped upstream (the browser suite on a change it does not read)
    # would otherwise skip this one too.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.gate.result == 'success' && needs.image.result == 'success' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/rollout.yml
    with:
      image: ${{ needs.image.outputs.image }}
    secrets:
      TABLE_PUSH_KEYS: ${{ secrets.TABLE_PUSH_KEYS }}
      TABLE_ALERT_EMAIL: ${{ secrets.TABLE_ALERT_EMAIL }}

  # A red main opens an issue, one at a time, and the next green run closes it. Its own failure (a repository
  # without issues) fails nothing: a run that is red for this alone would never count as the last green one.
  main-health:
    name: Say so when main is red
    runs-on: ubuntu-latest
    needs: [gate, deploy]
    if: always() && github.event_name == 'push'
    continue-on-error: true
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT: ${{ github.sha }}
          GATE: ${{ needs.gate.result }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          echo "gate: $GATE, deploy: $DEPLOY"
          if [[ "$GATE" == "failure" || "$DEPLOY" == "failure" ]]; then
            .github/scripts/health-issue.sh red red-main "main is red"
          elif [[ "$GATE" == "success" ]]; then
            .github/scripts/health-issue.sh green red-main
          fi
