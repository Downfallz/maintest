version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      testing:
        patterns: ["xunit*", "Microsoft.Testing.*", "Shouldly", "NSubstitute", "NetArchTest.*"]
    # The projects target net10.0: Microsoft.Extensions 11 belongs with the move to .NET 11, not before (#765).
    ignore:
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /learning
    schedule:
      interval: weekly
  # The battle prototype's renderer and its build (ADR 0123), pinned by battle/package-lock.json.
  - package-ecosystem: npm
    directory: /battle
    schedule:
      interval: weekly
  # The browser suite's own packages (studio/browser/package.json). A minor or major Playwright is moved by hand:
  # it brings the browser the cloud sessions have installed, and the two move together (#941). Its patches come.
  - package-ecosystem: npm
    directory: /studio/browser
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "@playwright/test"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
