version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*"]
      testing:
        patterns: ["xunit*", "Microsoft.Testing.*", "Shouldly", "NSubstitute", "NetArchTest.*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /learning
    schedule:
      interval: weekly
  # The battle prototype's renderer and its build (ADR 0123), pinned by battle/package-lock.json.
  - package-ecosystem: npm
    directory: /battle
    schedule:
      interval: weekly
