<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Downfall Arena — table</title>
    <link rel="stylesheet" href="table.css" />
  </head>
  <body>
    <header>
      <h1 id="seat">—</h1>
      <p id="phase" class="muted">Connecting…</p>
      <p id="rules" class="muted"></p>

      <!-- The round's shape, collapsed: the steps in the order they are played and the two orderings a player
           gets wrong. Every word of it is the host's (playtest-app.md §3.1). -->
      <details id="shape">
        <summary>The shape of a round</summary>
        <ol id="sub-phases"></ol>
        <ul id="orderings"></ul>
      </details>
    </header>

    <!-- The pass-the-device screen. It is a screen and not a banner: on one phone it is the whole fence
         between the two seats, and it has to be impossible to read the board through. -->
    <section id="pass" hidden>
      <p class="pass-line">Pass the device to</p>
      <p class="pass-seat" id="pass-seat">—</p>
      <button id="pass-ready" type="button">I am <span id="pass-seat-again">—</span></button>
    </section>

    <main id="table" hidden>
      <!-- Two tabs and not two panels: the mat is touched once a round, during Evolution, and a phone has
           one screen. -->
      <nav class="tabs">
        <button id="tab-board" type="button" class="tab on">Board</button>
        <button id="tab-mat" type="button" class="tab">Talents</button>
      </nav>

      <!-- One column, in the order playtest-app.md §3.3 gives: the enemy team, the initiative strip, your
           team, your hand. The enemies are at the top because they are what a decision is about, and the hand
           is at the bottom because it is the tallest thing on the page -- a hand above the boards means
           scrolling past five card faces to read the health a target choice depends on. -->
      <section id="board">
        <!-- The reveal strip is first because it is what the choice below it is about: during
             RevealAndTarget the player reads the cast, then the rows whose health and conditions decide the
             targets. Under the boards it would mean scrolling down to read the cast and back up to act on it.
             The four blocks §3.3 names keep their order among themselves. -->
        <div id="revealed" class="revealed" hidden></div>
        <div id="enemies"></div>
        <section id="timeline" class="strip" aria-label="Initiative"></section>
        <div id="allies"></div>
        <div id="backs"></div>
        <div id="own-hand"></div>
      </section>
      <section id="mat" hidden></section>

      <details id="log">
        <summary>What has happened</summary>
        <ol id="feed"></ol>
      </details>

      <section id="decision" class="sheet">
        <h2 id="asking">Waiting for the other seat…</h2>
        <div id="choices"></div>
        <p id="problem" class="problem" hidden></p>
      </section>
    </main>

    <script type="module" src="table.js"></script>
  </body>
</html>
