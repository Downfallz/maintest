<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111917" />
    <title>Downfall Arena — lobby</title>
    <link rel="stylesheet" href="table.css" />
    <link rel="stylesheet" href="pilot.css" />
    <link rel="stylesheet" href="lobby.css" />
  </head>
  <body>
    <header class="masthead">
      <div class="brand"><span class="brand-mark" aria-hidden="true">D</span><div><span class="eyebrow">The host</span><h1>Lobby</h1></div></div>
      <div class="session-state"><span class="seat-label">Rules</span><output id="rules">Connecting…</output></div>
    </header>

    <main id="lobby" hidden>
      <p class="muted no-god-view">
        Open a table, read each seat's code to its player, and hand a seat over from its pilot page. This page
        shows who is at each table, never what they hold. <span id="recording"></span>
      </p>

      <section class="control" aria-labelledby="open-title">
        <h2 id="open-title">Open a table</h2>
        <div class="fields">
          <label for="seat-1">player1<select id="seat-1"></select></label>
          <label for="seat-2">player2<select id="seat-2"></select></label>
          <label for="who">Initials<input id="who" type="text" maxlength="12" placeholder="mk" /></label>
          <label for="handover">Bots until round<input id="handover" type="number" min="1" step="1" placeholder="—" /></label>
          <button id="open" type="button">Open</button>
        </div>
        <output id="said" class="said"></output>
      </section>

      <section id="tables" class="seats tables" aria-label="Tables"></section>
    </main>

    <p id="problem" class="problem" hidden></p>
    <a id="sign-in" class="sign-in" hidden>Sign in to open a table</a>

    <script type="module" src="lobby.js"></script>
  </body>
</html>
