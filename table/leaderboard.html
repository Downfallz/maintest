<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1519" />
  <title>Downfall Instinct — the ladder</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="stylesheet" href="table.css" />
  <link rel="stylesheet" href="lobby.css" />
  <link rel="stylesheet" href="leaderboard.css" />
  <link rel="stylesheet" href="identity.css" />
  <script type="module" src="motion.js"></script>
  <script type="module" src="navigation.js"></script>
</head>
<body class="lobby-page">
  <header class="masthead lobby-header home-header" data-navigation="leaderboard"></header>
  <main class="lobby-main">
    <section class="lobby-hero" aria-labelledby="ladder-title">
      <div class="scene scene-head page-head" data-side="start"><div class="scene-words"><p class="eyebrow">Ranked games between two players</p><h2 id="ladder-title">The ladder.</h2></div></div>
      <div><p class="hero-detail">Every finished ranked game moves both players' ratings.</p></div>
    </section>
    <output id="ladder-status" class="lobby-status muted">Reading the ladder…</output>
    <p id="ladder-problem" class="problem" role="alert" hidden></p>
    <div class="lobby-layout ladder-layout">
      <aside class="lobby-sidebar" aria-label="Your place">
        <section class="lobby-panel your-place" aria-labelledby="you-heading"><h2 id="you-heading">Your place</h2><div id="you" class="you"></div></section>
      </aside>
      <section class="lobby-section" aria-labelledby="players-heading">
        <div class="section-heading"><h2 id="players-heading">Players <span id="players-count" class="lobby-count"></span></h2><span id="players-caption" class="muted">Rating ± how sure it is</span></div>
        <section id="ladder-table" class="ladder-scroll" aria-labelledby="players-heading">
          <table class="ladder" aria-labelledby="players-heading">
            <thead><tr><th scope="col" class="rank">#</th><th scope="col">Player</th><th scope="col" class="number">Rating</th><th scope="col" class="number">W–L–D</th><th scope="col" class="number games">Games</th></tr></thead>
            <tbody id="ladder-rows"></tbody>
          </table>
        </section>
        <p id="ladder-empty" class="empty-state" hidden>No one is on the ladder yet.</p>
        <p class="ladder-how"><a href="/rules#the-ladder">How the ladder counts</a></p>
      </section>
    </div>
  </main>
  <script type="module" src="leaderboard.js"></script>
</body>
</html>
