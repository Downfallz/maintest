<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1519" />
  <!-- The address carries the provider's code until the script takes it off: no request this page makes names it. -->
  <meta name="referrer" content="no-referrer" />
  <title>Downfall Instinct — Signing in</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/table.css" />
  <link rel="stylesheet" href="/lobby.css" />
  <link rel="stylesheet" href="/identity.css" />
  <script type="module" src="/motion.js"></script>
</head>
<body class="lobby-page">
  <main class="lobby-main">
    <section class="sign-in-panel" aria-labelledby="signin-heading">
      <div class="sign-in-content">
        <h1 id="signin-heading">Signing in</h1>
        <p class="muted"><output id="signin-state">Checking your sign-in…</output></p>
        <a id="signin-back" class="sign-in-policy" href="/lobby" hidden>Back to the lobby</a>
      </div>
    </section>
  </main>
  <script type="module" src="/signin.js"></script>
</body>
</html>
