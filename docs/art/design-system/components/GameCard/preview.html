<!-- @dsCard group="Surfaces" height=300 subtitle="A game in the lobby, yours and another's" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Game card</title>
<style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;padding:24px}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}</style></head>
<body><div class="grid">
<article class="game-card mine">
  <div class="head"><span class="eyebrow">Round 3</span><span class="status-tag your-turn">Your turn</span></div>
  <h3>Against Mira</h3>
  <p class="muted">Ranked · started yesterday</p>
  <button class="primary" type="button">Plan your orders</button>
</article>
<article class="game-card">
  <div class="head"><span class="eyebrow">Round 5</span><span class="status-tag">Waiting</span></div>
  <h3>Against Oren</h3>
  <p class="muted">Casual · 2 hours ago</p>
  <button type="button">Open the table</button>
</article>
</div></body></html>
