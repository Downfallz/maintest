<!doctype html>
<html><head><meta charset="utf-8"><title>Window</title>
<style>.wrap{padding:24px;display:flex;justify-content:center}dialog{width:min(460px,100%)}.dialog-heading{padding:20px 24px 18px}</style></head>
<body><div class="wrap">
<dialog open class="home-dialog" aria-labelledby="t">
  <div class="dialog-heading"><div><p class="eyebrow">The table</p><h2 id="t">New game</h2></div><button type="button" aria-label="Close">Close</button></div>
  <div class="window-body">
    <p class="muted">Choose an opponent and whether the result counts toward the leaderboard.</p>
    <div class="window-actions"><button type="button">Cancel</button><button class="primary" type="button">Create the game</button></div>
  </div>
</dialog>
</div></body></html>
